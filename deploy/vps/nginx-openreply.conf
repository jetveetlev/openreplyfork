# OpenReply behind the host's nginx. Replace DOMAIN_HERE with your DOMAIN from .env
# (e.g. 43-157-213-238.sslip.io), copy to /etc/nginx/sites-available/openreply,
# enable it, then run: sudo certbot --nginx -d DOMAIN_HERE
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_HERE;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
